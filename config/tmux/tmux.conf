
set-option -g prefix C-j
set-option -g prefix2 C-f

bind-key r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Behavior
set -g mouse on
set -sg escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on

# Splits — | vertical, - horizontal; both keep cwd
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind -n C-h previous-window
bind -n C-l next-window

bind-key g send-keys "source ~/.dotfiles/run.sh" Enter
bind-key f display-popup -E -w 70% -h 60% -B "~/.dotfiles/tmux-sessionizer.sh"
bind-key d run-shell "~/.dotfiles/tmux-sessionizer.sh ~/.dotfiles"
# Repo → worktrees picker with Claude status (needs the claude-status hooks:
# run `~/.dotfiles/bin/claude-status install` once per machine)
bind-key W display-popup -E -w 80% -h 70% -B -d "#{pane_current_path}" "~/.dotfiles/tmux-worktree-picker.sh"
bind-key C command-prompt -p "new worktree branch:" "run-shell '~/.dotfiles/tmux-wt-spawn.sh \"%%\"'"
bind-key A display-popup -E -w 80% -h 70% -B "~/.dotfiles/tmux-worktree-picker.sh --all"
# Same, without the prefix: Alt-A (on macOS, Ghostty maps left Option to Alt).
bind -n M-a display-popup -E -w 80% -h 70% -B "~/.dotfiles/tmux-worktree-picker.sh --all"


# ── Rose Pine Moon ────────────────────────────────────────────────
# base    #232136   surface #2a273f   overlay #393552
# muted   #6e6a86   subtle  #908caa   text    #e0def4
# love    #eb6f92   gold    #f6c177   rose    #ea9a97
# pine    #3e8fb0   foam    #9ccfd8   iris    #c4a7e7

# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"

# Panes
set -g pane-border-style "fg=#393552"
set -g pane-active-border-style "fg=#9ccfd8"
set -g display-panes-colour "#6e6a86"
set -g display-panes-active-colour "#c4a7e7"

# Messages / command prompt
set -g message-style "bg=default,fg=#c4a7e7"
set -g message-command-style "bg=default,fg=#c4a7e7"
set -g popup-border-style "fg=#c4a7e7"
set -g popup-border-lines rounded

# Copy mode
set -g mode-style "bg=#393552,fg=#e0def4"

# Clock
set -g clock-mode-colour "#9ccfd8"

# Status bar — transparent, no blocks: session left, windows centred,
# branch and clock right. Prefix active turns the session name gold.
# On the right, ● counts Claude sessions that need you, ◆ ones whose turn
# is done (from bin/claude-status).
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify centre
set -g status-style "bg=default,fg=#6e6a86"
set -g status-left-length 60
set -g status-right-length 80

set -g status-left "#{?client_prefix,#[fg=#f6c177],#[fg=#c4a7e7]}#[bold] ● #S #[default]"

set -g status-right "#(~/.dotfiles/bin/claude-status tmux)#[fg=#6e6a86]#{?window_zoomed_flag,zoom · ,}#(cd '#{pane_current_path}' && git rev-parse --abbrev-ref HEAD 2>/dev/null)  #[fg=#908caa]%H:%M "

# Windows — active is bright text with a foam index, others muted. A gold
# dot appears after the name when window_silence_flag fires (used to flag
# claude windows that are waiting for input — see wt-spawn / sessionizer).
set -g window-status-separator "   "
set -g window-status-format "#[fg=#6e6a86]#I #[fg=#908caa]#W#{?window_silence_flag,#[fg=#f6c177] ●,}"
set -g window-status-current-format "#[fg=#9ccfd8,bold]#I #[fg=#e0def4,bold]#W#{?window_silence_flag,#[fg=#f6c177#,nobold] ●,}"

set -g window-status-activity-style "fg=#eb6f92,bold"
set -g window-status-bell-style "fg=#eb6f92,bold"
# monitor-silence is enabled per-window for claude windows only (set by
# wt-spawn and the sessionizer). Global default stays off.
set -g monitor-silence 0
