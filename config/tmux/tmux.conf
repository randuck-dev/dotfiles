
set-option -g prefix C-j
set-option -g prefix2 C-f

bind-key r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Behavior
set -g mouse on
set -sg escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on

# Splits — | vertical, - horizontal; both keep cwd
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind -n C-h previous-window
bind -n C-l next-window

bind-key g send-keys "source ~/.dotfiles/run.sh" Enter
bind-key f display-popup -E -w 60% -h 60% -B "~/.dotfiles/tmux-sessionizer.sh"
bind-key d run-shell "~/.dotfiles/tmux-sessionizer.sh ~/.dotfiles"


# ── Rose Pine Moon ────────────────────────────────────────────────
# base    #232136   surface #2a273f   overlay #393552
# muted   #6e6a86   subtle  #908caa   text    #e0def4
# love    #eb6f92   gold    #f6c177   rose    #ea9a97
# pine    #3e8fb0   foam    #9ccfd8   iris    #c4a7e7

# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"

# Panes
set -g pane-border-style "fg=#393552"
set -g pane-active-border-style "fg=#9ccfd8"
set -g display-panes-colour "#6e6a86"
set -g display-panes-active-colour "#c4a7e7"

# Messages / command prompt
set -g message-style "bg=#2a273f,fg=#e0def4"
set -g message-command-style "bg=#2a273f,fg=#e0def4"

# Copy mode
set -g mode-style "bg=#393552,fg=#e0def4"

# Clock
set -g clock-mode-colour "#9ccfd8"

# Status bar
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#232136,fg=#908caa"
set -g status-left-length 100
set -g status-right-length 100

# Left: session name on an iris block
set -g status-left "#[bg=#c4a7e7,fg=#232136,bold] #S #[default]"

# Right: path · git branch · time
set -g status-right "#[bg=#2a273f,fg=#908caa] #{b:pane_current_path} #[bg=#2a273f,fg=#f6c177]  #(cd '#{pane_current_path}' && git rev-parse --abbrev-ref HEAD 2>/dev/null) #[bg=#9ccfd8,fg=#232136,bold]  %H:%M "

# Windows — active gets pine index + surface name
set -g window-status-separator ""
set -g window-status-format "#[bg=#2a273f,fg=#908caa] #I #W "
set -g window-status-current-format "#[bg=#3e8fb0,fg=#232136,bold] #I #[bg=#2a273f,fg=#e0def4,bold] #W "
set -g window-status-activity-style "fg=#eb6f92,bg=#232136,bold"
set -g window-status-bell-style "fg=#eb6f92,bg=#232136,bold"
